      <script>
        (function () {
          try {
            var palettes = {
              emerald_default: { from: '#064E3B', via: '#047857', to: '#065F46', primary: '#064E3B', accent: '#059669', softBg: '#ECFDF5', softBorder: '#A7F3D0', pageBg: '#F8FAFC' },

              summer_mango: { from: '#9a3412', via: '#ea580c', to: '#d97706', primary: '#9a3412', accent: '#ea580c', softBg: '#fffbeb', softBorder: '#fde68a', pageBg: '#fffbeb' },
              ramadan_noor: { from: '#042f2e', via: '#0f766e', to: '#1e1b4b', primary: '#134e4a', accent: '#d97706', softBg: '#f0fdfa', softBorder: '#99f6e4', pageBg: '#f0fdfa' },
              eid_festive: { from: '#4a044e', via: '#7e22ce', to: '#9d174d', primary: '#581c87', accent: '#9333ea', softBg: '#faf5ff', softBorder: '#e9d5ff', pageBg: '#faf5ff' },
              cool_blue: { from: '#082f49', via: '#0369a1', to: '#1e3a8a', primary: '#0c4a6e', accent: '#0284c7', softBg: '#f0f9ff', softBorder: '#bae6fd', pageBg: '#f0f9ff' },
              royal_crimson: { from: '#4c0519', via: '#881337', to: '#9f1239', primary: '#881337', accent: '#e11d48', softBg: '#fff1f2', softBorder: '#fecdd3', pageBg: '#F8FAFC' },
              ocean_indigo: { from: '#172554', via: '#1d4ed8', to: '#1e3a8a', primary: '#1e3a8a', accent: '#2563eb', softBg: '#eff6ff', softBorder: '#bfdbfe', pageBg: '#F8FAFC' },
              royal_purple: { from: '#3b0764', via: '#6b21a8', to: '#581c87', primary: '#581c87', accent: '#9333ea', softBg: '#faf5ff', softBorder: '#e9d5ff', pageBg: '#F8FAFC' },
              sunset_coral: { from: '#431407', via: '#c2410c', to: '#9a3412', primary: '#7c2d12', accent: '#ea580c', softBg: '#fff7ed', softBorder: '#fed7aa', pageBg: '#F8FAFC' },
              rose_magenta: { from: '#500724', via: '#be185d', to: '#831843', primary: '#831843', accent: '#db2777', softBg: '#fdf2f8', softBorder: '#fbcfe8', pageBg: '#F8FAFC' },
              coffee_bronze: { from: '#291303', via: '#713f12', to: '#422006', primary: '#422006', accent: '#854d0e', softBg: '#fdf8f6', softBorder: '#eaddd7', pageBg: '#F8FAFC' },
              luxury_midnight: { from: '#020617', via: '#1e293b', to: '#0f172a', primary: '#0f172a', accent: '#334155', softBg: '#f8fafc', softBorder: '#cbd5e1', pageBg: '#F8FAFC' }
            };
            var stripDemoSvg = function (u) {
              if (!u) return '';
              var s = String(u).trim();
              if (s.indexOf('FASHION%20MART') !== -1 || s.indexOf('FASHION MART') !== -1) return '';
              return s;
            };
            var meta = null;
            var rawMeta = window.localStorage.getItem('sm_boot_theme_meta_v1');
            if (rawMeta) {
              try {
                meta = JSON.parse(rawMeta);
                if (meta && meta.logoUrl) {
                  meta.logoUrl = stripDemoSvg(meta.logoUrl);
                }
              } catch (e) {}
            }
            var rawErp = window.localStorage.getItem('stockmaster_bd_persistent_erp_v2');
            if (rawErp) {
              try {
                var parsedErp = JSON.parse(rawErp);
                var biz = parsedErp && Array.isArray(parsedErp.businesses) ? parsedErp.businesses[0] : null;
                if (biz) {
                  var isWinter = !!biz.winterThemeEnabled || biz.storefrontTheme === 'winter_frost';
                  var erpLogo = stripDemoSvg(biz.logoUrl ? String(biz.logoUrl).trim() : '');
                  var preloaderOn = typeof biz.preloaderEnabled === 'boolean' ? biz.preloaderEnabled : (meta && typeof meta.preloaderEnabled === 'boolean' ? meta.preloaderEnabled : true);
                  var shimmerOn = typeof biz.preloaderShimmerEnabled === 'boolean' ? biz.preloaderShimmerEnabled : (meta && typeof meta.preloaderShimmerEnabled === 'boolean' ? meta.preloaderShimmerEnabled : true);
                  meta = {
                    theme: isWinter ? 'winter_frost' : (biz.storefrontTheme || (meta && meta.theme) || 'emerald_default'),
                    shopName: biz.name || (meta && meta.shopName) || 'কিডস অ্যান্ড ফ্যাশন মার্ট',
                    logoUrl: erpLogo,
                    preloaderEnabled: preloaderOn,
                    preloaderShimmerEnabled: shimmerOn
                  };
                  window.localStorage.setItem('sm_boot_theme_meta_v1', JSON.stringify(meta));
                }
              } catch (e) {}
            }
            var shell = document.getElementById('sm-boot-shell');
            if (shell && meta) {
              var isPreloaderOff = meta.preloaderEnabled === false;
              var isShimmerOff = meta.preloaderShimmerEnabled === false;
              if (isPreloaderOff && isShimmerOff) {
                shell.style.display = 'none';
              } else {
                var pal = palettes[meta.theme] || palettes.emerald_default;
                shell.style.setProperty('--boot-from', pal.from);
                shell.style.setProperty('--boot-via', pal.via);
                shell.style.setProperty('--boot-to', pal.to);
                shell.style.setProperty('--boot-primary', pal.primary);
                shell.style.setProperty('--boot-accent', pal.accent);
                shell.style.setProperty('--boot-soft-bg', pal.softBg);
                shell.style.setProperty('--boot-soft-border', pal.softBorder);
                shell.style.setProperty('--boot-page-bg', pal.pageBg);
                var logoEl = document.getElementById('sm-boot-logo-img');
                var statusEl = document.getElementById('sm-boot-status');
                var cleanMetaLogo = stripDemoSvg(meta.logoUrl);
                if (isPreloaderOff) {
                  shell.style.paddingTop = '24px';
                  if (logoEl) {
                    logoEl.src = '';
                    logoEl.style.display = 'none';
                  }
                  if (statusEl) {
                    statusEl.style.display = 'none';
                  }
                } else {
                  if (logoEl) {
                    if (cleanMetaLogo !== '') {
                      var cleanLogo = cleanMetaLogo;
                      if (cleanLogo.indexOf('./uploads/') === 0) {
                        cleanLogo = '/' + cleanLogo.slice(2);
                      } else if (cleanLogo.indexOf('uploads/') === 0) {
                        cleanLogo = '/' + cleanLogo;
                      }
                      logoEl.src = cleanLogo;
                      logoEl.style.display = 'block';
                    } else {
                      logoEl.src = '';
                      logoEl.style.display = 'none';
                    }
                  }
                  if (statusEl) {
                    statusEl.style.display = 'inline-flex';
                  }
                }
                var shimmerGridEl = document.getElementById('sm-boot-shimmer-grid');
                if (shimmerGridEl) {
                  shimmerGridEl.style.display = isShimmerOff ? 'none' : 'grid';
                  if (isPreloaderOff && !isShimmerOff) {
                    shimmerGridEl.style.marginTop = '8px';
                  }
                }
              }
            }
            var path = (window.location.pathname || '').toLowerCase().replace(/\/+$/, '');
            var search = (window.location.search || '').toLowerCase();
            var adminGate = String.fromCharCode(47, 115, 109, 97, 114, 116);
            var statusText = document.getElementById('sm-boot-status-text');
            if (statusText) {
              if (path.indexOf('/landing') === 0 || search.indexOf('landing=') !== -1) {
                statusText.textContent = 'অফার পেজ লোড হচ্ছে...';
              } else if (path === adminGate || path.slice(-adminGate.length) === adminGate) {
                statusText.textContent = 'ড্যাশবোর্ড লোড হচ্ছে...';
              }
            }
          } catch (e) {}
        })();

    <script>
      (function () {
        var isViteDev = !!document.querySelector('script[src*="@vite/client"], script[src*="/src/main.tsx"]');
        if (isViteDev || window.__STOCKMASTER_BOOTED__) return;

        var ver = 'v560_014e06e6';
        var path = (window.location.pathname || '').toLowerCase().replace(/\/+$/, '');
        var search = (window.location.search || '').toLowerCase();
        var adminGate = String.fromCharCode(47, 115, 109, 97, 114, 116);
        var isAdminRoute =
          path === adminGate ||
          path.slice(-adminGate.length) === adminGate ||
          search === '?smart' ||
          search.indexOf('?smart&') === 0 ||
          search.indexOf('route=smart') !== -1;

        var primaryBundle = isAdminRoute ? 'app.bundle.js' : 'storefront.bundle.js';
        var primaryAssetParam = isAdminRoute ? 'js' : 'sfjs';

        var candidates = [
          './assets/' + primaryBundle + '?v=' + ver,
          '/assets/' + primaryBundle + '?v=' + ver,
          './dist/assets/' + primaryBundle + '?v=' + ver,
          './index.php?__cpanel_asset=' + primaryAssetParam + '&v=' + ver,
          '/index.php?__cpanel_asset=' + primaryAssetParam + '&v=' + ver,
          './assets/app.bundle.js?v=' + ver,
          '/assets/app.bundle.js?v=' + ver,
          './index.php?__cpanel_asset=js&v=' + ver,
          '/index.php?__cpanel_asset=js&v=' + ver
        ];
        var idx = 0;
        function loadNextBundle() {
          if (window.__STOCKMASTER_BOOTED__ || idx >= candidates.length) return;
          var s = document.createElement('script');
          s.src = candidates[idx++];
          s.onload = function () {
            setTimeout(function () {
              if (!window.__STOCKMASTER_BOOTED__) loadNextBundle();
            }, 350);
          };
          s.onerror = loadNextBundle;
          document.body.appendChild(s);
        }
        loadNextBundle();
      })();
